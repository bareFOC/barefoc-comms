[package]
name = "cu-barefoc"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bareFOC/barefoc-comms"
rust-version = "1.95"
description = "Copper CuBridge implementation for multi-axis BareFOC actuator networks"

[lib]
name = "cu_barefoc"
path = "src/lib.rs"

[dependencies]
# Copper 1.3.x line (rustc 1.95+, available toolchain is 1.99.1).
cu29 = { version = "~1.3.3", default-features = false, features = ["std"] }
cu29-runtime = { version = "~1.3.3", default-features = false, features = ["std"] }
cu29-traits = { version = "~1.3.0", default-features = false, features = ["std"] }
# Reused #![no_std] master SDK (path dependency, unchanged).
barefoc-master = { path = "../../barefoc-master" }
heapless = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Optional host / bus adapters.
embedded-hal = { version = "1.0", optional = true }
embedded-io = { version = "0.7", optional = true }
cu-linux-resources = { version = "~1.3.0", optional = true }

[features]
default = ["mock"]
mock = []
i2c = ["dep:embedded-hal"]
serial = ["dep:embedded-io", "dep:cu-linux-resources"]
can = []

[lints]
workspace = true
