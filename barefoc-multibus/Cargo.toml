[package]
name = "barefoc-multibus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable no_std descriptor-driven register-map (control table) server core and controller-side client for address-based buses (I2C/SPI)."

[dependencies]
embedded-hal = { workspace = true }
barefoc = { path = "../../barefoc-core", default-features = false, features = ["boot"], optional = true }
barefoc-drivers = { path = "../../barefoc-drivers/barefoc-drivers", default-features = false, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
embedded-hal = { workspace = true }
embedded-hal-mock = "0.10"
barefoc-drivers = { path = "../../barefoc-drivers/barefoc-drivers", default-features = false }

[features]
default = ["std", "simplefoc-profile", "control-table"]
# Host builds/tests. The library itself never links std.
std = ["simplefoc-profile", "barefoc-drivers?/std"]
defmt = ["dep:defmt"]
# SimpleFOC register bridge: pulls barefoc-drivers for RegisterId/RegisterValue/RegisterBridge.
simplefoc-profile = ["dep:barefoc-drivers", "dep:barefoc"]
# Kinematics register bridge: enables barefoc-drivers/kinematics feature (Actuator1Dof impl).
kinematics = ["simplefoc-profile", "barefoc-drivers/kinematics", "barefoc/kinematics"]
# Universal Control Table profile mapping 0x00..0xAF with persistence and bootloader hooks.
control-table = ["dep:barefoc"]


[lints]
workspace = true
